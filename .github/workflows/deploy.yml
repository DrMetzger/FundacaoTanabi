name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versionar CSS/JS (evita cache antigo no navegador)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" *.html restrito/*.php

      - name: Gerar configuração (SMTP e acesso à área restrita)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          USR_SITE: ${{ secrets.USR_SITE }}
          PSW_SITE: ${{ secrets.PSW_SITE }}
        run: |
          php -r '
            $c = [
              "smtp_user"  => (string) getenv("SMTP_USER"),
              "smtp_pass"  => (string) getenv("SMTP_SENHA"),
              "admin_user" => (string) getenv("USR_SITE"),
              "admin_hash" => getenv("PSW_SITE") ? password_hash((string) getenv("PSW_SITE"), PASSWORD_DEFAULT) : "",
            ];
            file_put_contents("api/config.php", "<?php\nreturn " . var_export($c, true) . ";\n");
          '
          php -r '$c = include "api/config.php"; echo "admin configurado: ", ($c["admin_user"] !== "" && $c["admin_hash"] !== "") ? "sim" : "NAO", "\n";'

      - name: Enviar site para /public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.IP_FTP }}
          username: ${{ secrets.USER_FTP }}
          password: ${{ secrets.SENHA_FTP }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
